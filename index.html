    <div>
        <div class="controls">
            <button onclick="setGrid(2)">2 Columns</button>
            <button onclick="setGrid(3)">3 Columns</button>
            <button onclick="setGrid(4)">4 Columns</button>
            <button onclick="setAnimationDirection()">reset</button>
        </div>
        <p style="text-align: center;">Single Column</p>
        <div class="controls single-column-control">
            <button onclick="setGrid(2)">1st Column</button>
            <button onclick="setGrid(3)">2nd Column</button>
            <button onclick="setGrid(4)">3rd Column</button>

        </div>
        <div>
            <p style="text-align: center;">Rotate & Translate</p>
            <form class="rotate-control">
                <div class="control">
                    <label>Rotate X:</label>
                    <input type="range" id="rotateXRange" min="-360" max="360" value="55">
                    <input type="number" id="rotateX" min="-360" max="360" value="55">
                </div>

                <div class="control">
                    <label>Rotate Z:</label>
                    <input type="range" id="rotateZRange" min="-360" max="360" value="-45">
                    <input type="number" id="rotateZ" min="-360" max="360" value="-45">
                </div>

                <div class="control">
                    <label>Translate X (%):</label>
                    <input type="range" id="translateXRange" min="-100" max="100" value="-40">
                    <input type="number" id="translateX" min="-100" max="100" value="-40">
                </div>

                <div class="control">
                    <label>Translate Y (vw):</label>
                    <input type="range" id="translateYRange" min="-100" max="100" value="-45">
                    <input type="number" id="translateY" min="-100" max="100" value="-45">
                </div>

                <div class="control">
                    <label>Perspective (px):</label>
                    <input type="range" id="perspectiveRange" min="200" max="2000" value="1000">
                    <input type="number" id="perspective" min="200" max="2000" value="1000">
                </div>
            </form>
        </div>
        <div>
            <p style="text-align: center;">overlay on the card</p>
            <button onclick="addOverlayOnCard()">Add overlay</button>
            <button onclick="removeOverlayOnCard()">Remove overlay</button>
        </div>

        <form id="titleForm">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="Enter title..." />
            <button type="submit">Submit</button>
        </form>
