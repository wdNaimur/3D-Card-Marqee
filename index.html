                        alt="Placeholder"></div>

        </section>
    </div>

    <div>
        <div class="controls">
            <button onclick="setGrid(2)">2 Columns</button>
            <button onclick="setGrid(3)">3 Columns</button>
            <button onclick="setGrid(4)">4 Columns</button>
            <button onclick="setAnimationDirection()">reset</button>
        </div>
        <p style="text-align: center;">Single Column</p>
        <div class="controls single-column-control">
            <button onclick="setGrid(2)">1st Column</button>
            <button onclick="setGrid(3)">2nd Column</button>
            <button onclick="setGrid(4)">3rd Column</button>

        </div>
        <p style="text-align: center;">Rotate</p>
        <form class="rotate-control">
            <div class="control">
                <label>Rotate X:</label>
                <input type="range" id="rotateXRange" min="-360" max="360" value="55">
                <input type="number" id="rotateX" min="-360" max="360" value="55">
            </div>

            <div class="control">
                <label>Rotate Z:</label>
                <input type="range" id="rotateZRange" min="-360" max="360" value="-45">
                <input type="number" id="rotateZ" min="-360" max="360" value="-45">
            </div>
        </form>
    </div>
    <script src="script.js"></script>
