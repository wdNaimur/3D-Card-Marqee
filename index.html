    <!-- Controller Section -->
    <div class="controller-panel">
      <!-- Set Animation -->
      <div class="panel-section">
        <h3>Animation</h3>
        <div class="controls">
          <button onclick="setAnimation('columnUpDown')">Column Up Down</button>
          <button onclick="setAnimation('infinityUp')">Infinity Up</button>
          <button onclick="setAnimation('infinityDown')">Infinity Down</button>
        </div>
      </div>

      <!-- Grid Columns Controls -->
      <div class="panel-section">
        <h3>Grid Columns</h3>
        <div class="controls">
          <button onclick="setGrid(2)">2 Columns</button>
          <button onclick="setGrid(3)">3 Columns</button>
          <button onclick="setGrid(4)">4 Columns</button>
        </div>
      </div>

      <!-- Single Column Control -->
      <div class="panel-section">
        <h3>Single Column</h3>
        <div class="controls">
          <button onclick="setGrid(2)">1st</button>
          <button onclick="setGrid(3)">2nd</button>
          <button onclick="setGrid(4)">3rd</button>
        </div>
      </div>

      <!-- Transform Control -->
      <div class="panel-section">
        <h3>Rotate & Translate</h3>
        <form class="rotate-control">
          <div class="control">
            <label>Rotate X:</label>
            <input
              type="range"
              id="rotateXRange"
              min="-360"
              max="360"
              value="55"
            />
            <input type="number" id="rotateX" min="-360" max="360" value="55" />
          </div>
          <div class="control">
            <label>Rotate Z:</label>
            <input
              type="range"
              id="rotateZRange"
              min="-360"
              max="360"
              value="-45"
            />
            <input
              type="number"
              id="rotateZ"
              min="-360"
              max="360"
              value="-45"
            />
          </div>
          <div class="control">
            <label>Translate X (%):</label>
            <input
              type="range"
              id="translateXRange"
              min="-100"
              max="100"
              value="-40"
            />
            <input
              type="number"
              id="translateX"
              min="-100"
              max="100"
              value="-40"
            />
          </div>
          <div class="control">
            <label>Translate Y (vw):</label>
            <input
              type="range"
              id="translateYRange"
              min="-100"
              max="100"
              value="-45"
            />
            <input
              type="number"
              id="translateY"
              min="-100"
              max="100"
              value="-45"
            />
          </div>
          <div class="control">
            <label>Perspective (px):</label>
            <input
              type="range"
              id="perspectiveRange"
              min="200"
              max="2000"
              value="1000"
            />
            <input
              type="number"
              id="perspective"
              min="200"
              max="2000"
              value="1000"
            />
          </div>
        </form>
      </div>

      <!-- Overlay Control -->
      <div class="panel-section">
        <h3>Overlay</h3>
        <div class="controls">
          <button onclick="addOverlayOnCard()">Add</button>
          <button onclick="removeOverlayOnCard()">Remove</button>
        </div>
      </div>

      <!-- Title Control -->
      <div class="panel-section">
        <h3>Title</h3>
        <form id="titleForm" class="title-form">
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter title..."
          />
          <button type="submit">Submit</button>
        </form>
      </div>
